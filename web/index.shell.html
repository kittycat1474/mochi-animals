<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6e9d5">
<meta name="description" content="Mochi Animals — drop, merge, and meet new friends.">
<title>$GODOT_PROJECT_NAME</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6e9d5;touch-action:none}
body{display:grid;place-items:center}
#canvas{display:block;outline:none}
#cover{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:hidden;background:#d6e9d5}
#cover-image{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center}
#loading-progress{position:absolute;bottom:max(7%,calc(env(safe-area-inset-bottom) + 24px));width:min(72%,420px);text-align:center;color:#713b27;font:700 14px/1.5 system-ui,sans-serif;text-shadow:0 1px 2px #fff}
#progress-track{height:16px;border-radius:999px;background:#fff0e9;border:2px solid #fff8f2;box-shadow:0 2px 8px #713b2740;overflow:hidden}
#progress-fill{height:100%;width:0;background:#f397b4;border-radius:999px}
#progress-label{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:12px;background:#fff8efe8}
#notice{position:absolute;left:9%;right:9%;bottom:max(6%,env(safe-area-inset-bottom));padding:12px;border-radius:16px;background:#fff8efee;color:#713b27;text-align:center;font:600 14px/1.4 system-ui,sans-serif;white-space:pre-wrap}
button{border:0;border-radius:20px;padding:10px 20px;margin-top:10px;background:#ef8c82;color:#fff;font-weight:700}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" aria-label="Mochi Animals game"></canvas>
<section id="cover" aria-label="Loading Mochi Animals" aria-busy="true">
<img id="cover-image" src="loading-static-v2.webp" fetchpriority="high" alt="Mochi Animals village illustration">
<div id="loading-progress">
<div id="progress-track" role="progressbar" aria-label="Game download" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div>
<span id="progress-label" role="status">Loading…</span>
</div>
<div id="notice" role="alert" hidden></div>
</section>
<noscript>Please enable JavaScript to play Mochi Animals.</noscript>
<script src="input-v3.js"></script>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const notice=document.getElementById('notice');
const track=document.getElementById('progress-track');
const fill=document.getElementById('progress-fill');
const progressLabel=document.getElementById('progress-label');
function updateProgress(current,total){
  // These are actual downloaded bytes reported by Godot, not a timer.
  if(total>0){const percent=Math.min(100,Math.floor(current/total*100));fill.style.width=percent+'%';track.setAttribute('aria-valuenow',String(percent));progressLabel.textContent=percent===100?'Starting game…':'Loading… '+percent+'%'}
}
function fail(error){document.getElementById('loading-progress').hidden=true;notice.hidden=false;notice.textContent=error.message||String(error);const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=()=>location.reload();notice.appendChild(document.createElement('br'));notice.appendChild(retry)}
// One static cover and one real progress bar until the first gameplay frame.
window.addEventListener('mochi-ready',()=>document.getElementById('cover')?.remove(),{once:true});
window.addEventListener('mochi-load-error',()=>fail(new Error('Unable to load. Please try again.')),{once:true});
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(new Error('This browser is missing: '+missing.join(', ')))}
else{engine.startGame({onProgress:updateProgress}).catch(fail)}
</script>
</body>
</html>
