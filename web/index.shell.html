<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9d7fb">
<meta name="description" content="Mochi Animals — drop, merge, and meet new friends.">
<title>$GODOT_PROJECT_NAME</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d7fb;touch-action:none}body{display:grid;place-items:center}#canvas{display:block;outline:none}#cover{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#a9d7fb}#cover-frame{position:relative;height:100%;max-height:100vh;aspect-ratio:941/1672;max-width:100vw;overflow:hidden;background:#a9d7fb}#cover-image{display:block;width:100%;height:100%;object-fit:cover}#notice{position:absolute;left:9%;right:9%;top:85%;padding:12px;border-radius:16px;background:#fff8efee;color:#713b27;text-align:center;font:600 14px/1.4 system-ui,sans-serif;white-space:pre-wrap}button{border:0;border-radius:20px;padding:10px 20px;margin-top:10px;background:#ef8c82;color:#fff;font-weight:700}@media (min-aspect-ratio:941/1672){#cover{background:#a9d7fb}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" aria-label="Mochi Animals game"></canvas>
<section id="cover" aria-label="Mochi Animals loading screen"><div id="cover-frame">
<img id="cover-image" src="loading-cover.png" alt="Mochi Animals loading illustration">
<div id="notice" role="alert" hidden></div>
</div></section>
<noscript>Please enable JavaScript to play Mochi Animals.</noscript>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const notice=document.getElementById('notice');
function fail(error){notice.hidden=false;notice.textContent=error.message||String(error);const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=()=>location.reload();notice.appendChild(document.createElement('br'));notice.appendChild(retry)}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(new Error('This browser is missing: '+missing.join(', ')))}
else{engine.startGame().then(()=>document.getElementById('cover').remove()).catch(fail)}
</script>
</body>
</html>
